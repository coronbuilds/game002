<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>DODGE OR DIE</title>

<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080b12;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    linear-gradient(#0b1020, #05070c);
}

#hud {
  position: absolute;
  top: 15px;
  left: 0;
  width: 100%;
  padding: 0 18px;
  display: flex;
  justify-content: space-between;
  color: white;
  font-size: 18px;
  font-weight: bold;
  z-index: 20;
  pointer-events: none;
}

#score {
  color: #fff;
}

#best {
  color: #aaa;
}

#player {
  position: absolute;
  width: 54px;
  height: 54px;
  bottom: 45px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 14px;
  background: #27a7ff;
  box-shadow: 0 0 20px rgba(39,167,255,.6);
  z-index: 10;
}

.enemy {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #ff304f;
  box-shadow: 0 0 18px rgba(255,48,79,.6);
  z-index: 5;
}

.gem {
  position: absolute;
  width: 30px;
  height: 30px;
  transform: rotate(45deg);
  background: #55e6ff;
  box-shadow: 0 0 18px rgba(85,230,255,.7);
  z-index: 4;
}

.gem::after {
  content: "";
  position: absolute;
  inset: 6px;
  background: #dfffff;
}

#message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  background: rgba(0,0,0,.65);
  z-index: 50;
  text-align: center;
}

#message h1 {
  margin: 0 0 12px;
  font-size: 42px;
}

#message p {
  margin: 6px 0;
  color: #ccc;
}

button {
  margin-top: 22px;
  border: 0;
  border-radius: 12px;
  padding: 14px 28px;
  font-size: 18px;
  font-weight: bold;
  background: white;
  color: black;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">
    <div id="score">SCORE 0</div>
    <div id="best">BEST 0</div>
  </div>

  <div id="player"></div>

  <div id="message">
    <h1>DODGE OR DIE</h1>
    <p>🔴 避けろ</p>
    <p>💎 取れ</p>
    <p>指で左右に移動</p>
    <button id="start">START</button>
  </div>

</div>

<script>
"use strict";

/* =========================
   基本設定
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const message = document.getElementById("message");
const startButton = document.getElementById("start");

let running = false;

let playerX = window.innerWidth / 2;
let playerTargetX = playerX;

let score = 0;
let best = Number(localStorage.getItem("dod2_best") || 0);

let enemies = [];
let gems = [];

let lastTime = 0;
let enemyTimer = 0;
let gemTimer = 0;
let scoreTimer = 0;

let difficulty = 1;

bestText.textContent = "BEST " + best;


/* =========================
   プレイヤー
========================= */

function movePlayer(x) {
  const width = game.clientWidth;
  const half = 27;

  playerTargetX = Math.max(
    half,
    Math.min(width - half, x)
  );
}

game.addEventListener("pointermove", e => {
  if (!running) return;
  movePlayer(e.clientX);
});

game.addEventListener("pointerdown", e => {
  if (!running) return;
  movePlayer(e.clientX);
});


/* =========================
   敵生成
========================= */

function createEnemy() {

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  const width = game.clientWidth;
  const x = Math.random() * (width - 42);

  enemy.style.left = x + "px";
  enemy.style.top = "-50px";

  game.appendChild(enemy);

  enemies.push({
    el: enemy,
    x: x,
    y: -50,
    speed: 220 + Math.random() * 100 + difficulty * 15
  });
}


/* =========================
   ジェム生成
========================= */

function createGem() {

  const gem = document.createElement("div");
  gem.className = "gem";

  const width = game.clientWidth;
  const x = Math.random() * (width - 30);

  gem.style.left = x + "px";
  gem.style.top = "-40px";

  game.appendChild(gem);

  gems.push({
    el: gem,
    x: x,
    y: -40,
    speed: 190 + difficulty * 10
  });
}


/* =========================
   当たり判定
========================= */

function hitTest(a, b, aw, ah, bw, bh) {

  return (
    a.x < b.x + bw &&
    a.x + aw > b.x &&
    a.y < b.y + bh &&
    a.y + ah > b.y
  );
}


/* =========================
   ゲーム開始
========================= */

function startGame() {

  enemies.forEach(e => e.el.remove());
  gems.forEach(g => g.el.remove());

  enemies = [];
  gems = [];

  score = 0;
  difficulty = 1;

  enemyTimer = 0;
  gemTimer = 0;
  scoreTimer = 0;

  playerX = game.clientWidth / 2;
  playerTargetX = playerX;

  player.style.left = playerX + "px";

  scoreText.textContent = "SCORE 0";

  message.classList.add("hidden");

  running = true;

  lastTime = performance.now();

  requestAnimationFrame(gameLoop);
}


/* =========================
   ゲームオーバー
========================= */

function gameOver() {

  running = false;

  if (score > best) {
    best = score;
    localStorage.setItem("dod2_best", best);
  }

  bestText.textContent = "BEST " + best;

  message.innerHTML = `
    <h1>GAME OVER</h1>
    <p>SCORE ${score}</p>
    <p>BEST ${best}</p>
    <button id="restart">RETRY</button>
  `;

  message.classList.remove("hidden");

  document.getElementById("restart")
    .addEventListener("click", startGame);
}


/* =========================
   メインゲームループ
========================= */

function gameLoop(now) {

  if (!running) return;

  const dt = Math.min(
    (now - lastTime) / 1000,
    0.05
  );

  lastTime = now;

  /* 難易度 */
  difficulty += dt * 0.025;

  /* プレイヤーを滑らかに移動 */

  const smooth = 1 - Math.pow(0.0001, dt);

  playerX +=
    (playerTargetX - playerX) * smooth;

  player.style.left = playerX + "px";


  /* 敵生成 */

  enemyTimer += dt;

  const enemyInterval =
    Math.max(
      0.25,
      0.75 - difficulty * 0.025
    );

  if (enemyTimer >= enemyInterval) {
    enemyTimer = 0;
    createEnemy();
  }


  /* ジェム生成 */

  gemTimer += dt;

  if (gemTimer >= 1.8) {
    gemTimer = 0;
    createGem();
  }


  /* スコア */

  scoreTimer += dt;

  if (scoreTimer >= 0.1) {
    scoreTimer = 0;
    score++;
    scoreText.textContent =
      "SCORE " + score;
  }


  /* =====================
     敵の移動
  ===================== */

  for (let i = enemies.length - 1; i >= 0; i--) {

    const enemy = enemies[i];

    enemy.y += enemy.speed * dt;

    enemy.el.style.transform =
      `translate3d(0, ${enemy.y}px, 0)`;

    /*
      画面外に出たら削除
    */

    if (enemy.y > game.clientHeight + 60) {

      enemy.el.remove();
      enemies.splice(i, 1);

      continue;
    }

    /*
      プレイヤーとの衝突
    */

    const playerRect = {
      x: playerX - 27,
      y: game.clientHeight - 45 - 54,
      w: 54,
      h: 54
    };

    const enemyRect = {
      x: enemy.x,
      y: enemy.y,
      w: 42,
      h: 42
    };

    if (
      hitTest(
        playerRect,
        enemyRect,
        playerRect.w,
        playerRect.h,
        enemyRect.w,
        enemyRect.h
      )
    ) {

      gameOver();
      return;
    }
  }


  /* =====================
     ジェムの移動
  ===================== */

  for (let i = gems.length - 1; i >= 0; i--) {

    const gem = gems[i];

    gem.y += gem.speed * dt;

    gem.el.style.transform =
      `translate3d(0, ${gem.y}px, 0) rotate(45deg)`;


    if (gem.y > game.clientHeight + 50) {

      gem.el.remove();
      gems.splice(i, 1);

      continue;
    }


    const playerRect = {
      x: playerX - 27,
      y: game.clientHeight - 45 - 54,
      w: 54,
      h: 54
    };

    const gemRect = {
      x: gem.x,
      y: gem.y,
      w: 30,
      h: 30
    };


    if (
      hitTest(
        playerRect,
        gemRect,
        playerRect.w,
        playerRect.h,
        gemRect.w,
        gemRect.h
      )
    ) {

      score += 50;

      scoreText.textContent =
        "SCORE " + score;

      gem.el.remove();
      gems.splice(i, 1);
    }
  }


  requestAnimationFrame(gameLoop);
}


/* =========================
   START
========================= */

startButton.addEventListener(
  "click",
  startGame
);

</script>

</body>
</html>
